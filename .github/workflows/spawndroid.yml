name: Appium QA
on:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./gradlew :app:assembleDebug
      - name: Prepare Appium smoke test
        run: |
          cat > smoke.py <<'PY'
          import os, json, urllib.request, sys, time
          import xml.etree.ElementTree as ET
          base = os.environ['SPAWNDROID_WD_URL'].rstrip('/')
          def req(method, path, data=None):
              body = None if data is None else json.dumps(data).encode()
              r = urllib.request.Request(base + path, data=body, method=method, headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(r, timeout=90) as response:
                  result = json.load(response)
              if isinstance(result.get('value'), dict) and result['value'].get('error'):
                  raise RuntimeError(result['value'])
              return result.get('value')
          sid = None
          error = None
          started = time.time()
          try:
              value = req('POST', '/session', {'capabilities': {'alwaysMatch': {'platformName':'Android', 'appium:automationName':'UiAutomator2', 'appium:udid':os.environ['SPAWNDROID_UDID'], 'appium:noReset':True}}})
              sid = value['sessionId']
              pkg = os.environ['SPAWNDROID_APP_PACKAGE']
              req('POST', '/session/' + sid + '/execute/sync', {'script':'mobile: activateApp', 'args':[{'appId':pkg}]})
              source = ''
              attempt = 0
              for attempt in range(20):
                  source = req('GET', '/session/' + sid + '/source')
                  if pkg in source:
                      break
                  time.sleep(2)
              assert pkg in source, 'Installed app must be visible in UI hierarchy after 40s; foreground XML starts: ' + source[:600]
              print('PASS: Appium session created, app activated, UI hierarchy read on poll', attempt + 1)
              assert 'Count: 999999' in source, 'Intentional UI assertion failure: expected counter text Count: 999999 was absent'
          except Exception as exc:
              if hasattr(exc, 'read'):
                  print('HTTP diagnostic:', exc.read(2000).decode(errors='replace'))
              error = str(exc)
              print('FAIL:', error)
          finally:
              if sid:
                  try: req('DELETE', '/session/' + sid)
                  except Exception as exc: print('Appium cleanup:', exc)
              suite = ET.Element('testsuite', name='SpawnDroid Appium smoke', tests='1', failures=str(int(error is not None)), time=str(time.time()-started))
              case = ET.SubElement(suite, 'testcase', classname='Counter', name='launch_and_read_ui')
              if error: ET.SubElement(case, 'failure', message=error).text = error
              ET.ElementTree(suite).write('junit.xml', encoding='unicode')
              sys.exit(1 if error else 0)
          PY
          cat > qa.yaml <<'YAML'
          version: 1
          app: app/build/outputs/apk/debug/app-debug.apk
          command: [python3, smoke.py]
          report: junit.xml
          timeout: 300
          YAML
      - name: Run Appium on SpawnDroid
        env:
          SPAWNDROID_API_KEY: ${{ secrets.SPAWNDROID_API_KEY }}
          QA_FORCE_FAIL: '1'
        run: npx --yes spawndroid run --config qa.yaml
